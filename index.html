<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>太空射击游戏 - 增强版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            font-size: 28px;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4), inset 0 0 50px rgba(0, 0, 0, 0.5);
            background: #0a0a15;
            touch-action: none;
        }

        .info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 10px 5px;
            color: #fff;
            font-size: 16px;
            gap: 5px;
        }

        .info > div {
            background: rgba(0, 255, 136, 0.2);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .wave {
            background: rgba(255, 200, 0, 0.2) !important;
            border-color: rgba(255, 200, 0, 0.3) !important;
            color: #ffc800;
        }

        .high-score {
            background: rgba(255, 100, 100, 0.2) !important;
            border-color: rgba(255, 100, 100, 0.3) !important;
            color: #ff8888;
        }

        .power-ups-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
            min-height: 30px;
        }

        .power-up-indicator {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .instructions {
            color: #888;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .instructions span {
            color: #00ff88;
        }

        /* Mobile touch controls */
        .touch-controls {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 10px;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #00ff88;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .touch-btn:active {
            background: rgba(0, 255, 136, 0.5);
            transform: scale(0.95);
        }

        .touch-btn.fire {
            width: 90px;
            height: 90px;
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .touch-btn.fire:active {
            background: rgba(255, 68, 68, 0.5);
        }

        .move-controls {
            display: flex;
            gap: 15px;
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>太空射击 - 增强版</h1>
        <div class="info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="wave">波次: <span id="wave">1</span></div>
            <div class="lives">生命: <span id="lives">3</span></div>
            <div class="high-score">最高: <span id="highScore">0</span></div>
        </div>
        <div class="power-ups-display" id="powerUpsDisplay"></div>
        <canvas id="gameCanvas" width="600" height="500"></canvas>
        <div class="instructions">
            <span>← →</span> 或 <span>A D</span> 移动 | <span>空格</span> 射击 | <span>R</span> 重新开始 | <span>P</span> 暂停
        </div>
        <div class="touch-controls">
            <div class="move-controls">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnRight">▶</div>
            </div>
            <div class="touch-btn fire" id="btnFire">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const waveElement = document.getElementById('wave');
        const highScoreElement = document.getElementById('highScore');
        const powerUpsDisplay = document.getElementById('powerUpsDisplay');

        // Load high score from localStorage
        let highScore = parseInt(localStorage.getItem('spaceShooterHighScore')) || 0;
        highScoreElement.textContent = highScore;

        // Game state
        let gameState = {
            score: 0,
            lives: 3,
            wave: 1,
            isGameOver: false,
            isPaused: false,
            bossActive: false,
            bossDefeated: 0
        };

        // Power-up types
        const POWERUP_TYPES = {
            TRIPLE_SHOT: { color: '#ffff00', symbol: '◆', name: '三连射', duration: 10000 },
            SHIELD: { color: '#00ffff', symbol: '◯', name: '护盾', duration: 8000 },
            SPEED: { color: '#ff00ff', symbol: '»', name: '加速', duration: 8000 },
            EXTRA_LIFE: { color: '#ff6688', symbol: '♥', name: '+1生命', duration: 0 }
        };

        // Active power-ups
        let activePowerUps = {
            tripleShot: false,
            shield: false,
            speed: false
        };
        let powerUpTimers = {};

        // Player ship
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 60,
            width: 50,
            height: 40,
            speed: 7,
            baseSpeed: 7,
            color: '#00ff88',
            shieldRadius: 35
        };

        // Arrays for game objects
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let explosions = [];
        let powerUps = [];
        let particles = [];
        let boss = null;

        // Bullet settings
        const bulletSpeed = 10;
        const bulletCooldown = 200;
        let lastBulletTime = 0;

        // Enemy settings
        let enemySpawnRate = 1500;
        let lastEnemySpawn = 0;

        // Enemy types
        const ENEMY_TYPES = {
            BASIC: { width: 40, height: 30, health: 1, speed: 2, score: 10, color: '#ff4444', shootChance: 0 },
            FAST: { width: 30, height: 25, health: 1, speed: 4, score: 15, color: '#ff8844', shootChance: 0 },
            TANK: { width: 50, height: 40, health: 3, speed: 1.5, score: 30, color: '#aa44ff', shootChance: 0.005 },
            SHOOTER: { width: 35, height: 30, health: 2, speed: 2, score: 25, color: '#44aaff', shootChance: 0.02 }
        };

        // Keyboard state
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Touch controls
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnFire = document.getElementById('btnFire');

        // Touch event handlers
        function setupTouchControls() {
            const handleTouch = (element, key, isFireButton = false) => {
                element.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    keys[key] = true;
                });
                element.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    keys[key] = false;
                });
                element.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    keys[key] = false;
                });
            };

            handleTouch(btnLeft, 'left');
            handleTouch(btnRight, 'right');
            handleTouch(btnFire, 'space', true);
        }
        setupTouchControls();

        // Keyboard event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ') {
                e.preventDefault();
                keys.space = true;
            }
            if (e.key === 'r' || e.key === 'R') resetGame();
            if (e.key === 'p' || e.key === 'P') togglePause();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ') keys.space = false;
        });

        // Toggle pause
        function togglePause() {
            if (!gameState.isGameOver) {
                gameState.isPaused = !gameState.isPaused;
            }
        }

        // Update power-ups display
        function updatePowerUpsDisplay() {
            powerUpsDisplay.innerHTML = '';
            if (activePowerUps.tripleShot) {
                const div = document.createElement('div');
                div.className = 'power-up-indicator';
                div.style.background = 'rgba(255, 255, 0, 0.3)';
                div.style.color = '#ffff00';
                div.textContent = '◆ 三连射';
                powerUpsDisplay.appendChild(div);
            }
            if (activePowerUps.shield) {
                const div = document.createElement('div');
                div.className = 'power-up-indicator';
                div.style.background = 'rgba(0, 255, 255, 0.3)';
                div.style.color = '#00ffff';
                div.textContent = '◯ 护盾';
                powerUpsDisplay.appendChild(div);
            }
            if (activePowerUps.speed) {
                const div = document.createElement('div');
                div.className = 'power-up-indicator';
                div.style.background = 'rgba(255, 0, 255, 0.3)';
                div.style.color = '#ff00ff';
                div.textContent = '» 加速';
                powerUpsDisplay.appendChild(div);
            }
        }

        // Activate power-up
        function activatePowerUp(type) {
            switch(type) {
                case 'TRIPLE_SHOT':
                    activePowerUps.tripleShot = true;
                    clearTimeout(powerUpTimers.tripleShot);
                    powerUpTimers.tripleShot = setTimeout(() => {
                        activePowerUps.tripleShot = false;
                        updatePowerUpsDisplay();
                    }, POWERUP_TYPES.TRIPLE_SHOT.duration);
                    break;
                case 'SHIELD':
                    activePowerUps.shield = true;
                    clearTimeout(powerUpTimers.shield);
                    powerUpTimers.shield = setTimeout(() => {
                        activePowerUps.shield = false;
                        updatePowerUpsDisplay();
                    }, POWERUP_TYPES.SHIELD.duration);
                    break;
                case 'SPEED':
                    activePowerUps.speed = true;
                    player.speed = player.baseSpeed * 1.5;
                    clearTimeout(powerUpTimers.speed);
                    powerUpTimers.speed = setTimeout(() => {
                        activePowerUps.speed = false;
                        player.speed = player.baseSpeed;
                        updatePowerUpsDisplay();
                    }, POWERUP_TYPES.SPEED.duration);
                    break;
                case 'EXTRA_LIFE':
                    gameState.lives = Math.min(gameState.lives + 1, 5);
                    livesElement.textContent = gameState.lives;
                    break;
            }
            updatePowerUpsDisplay();
        }

        // Spawn power-up
        function spawnPowerUp(x, y) {
            if (Math.random() < 0.15) { // 15% chance to drop power-up
                const types = Object.keys(POWERUP_TYPES);
                const type = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    type: type,
                    ...POWERUP_TYPES[type],
                    width: 25,
                    height: 25,
                    speed: 2
                });
            }
        }

        // Draw player ship
        function drawPlayer() {
            // Draw shield if active
            if (activePowerUps.shield) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.shieldRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = player.color;

            // Ship body
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width * 0.8, player.y + player.height * 0.7);
            ctx.lineTo(player.x + player.width * 0.2, player.y + player.height * 0.7);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Glow effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Cockpit
            ctx.fillStyle = '#004d29';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + player.height * 0.4, 8, 0, Math.PI * 2);
            ctx.fill();

            // Engine flames
            const flameHeight = Math.random() * 10 + 8;
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width * 0.3, player.y + player.height * 0.8);
            ctx.lineTo(player.x + player.width * 0.4, player.y + player.height + flameHeight);
            ctx.lineTo(player.x + player.width * 0.5, player.y + player.height * 0.85);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(player.x + player.width * 0.5, player.y + player.height * 0.85);
            ctx.lineTo(player.x + player.width * 0.6, player.y + player.height + flameHeight);
            ctx.lineTo(player.x + player.width * 0.7, player.y + player.height * 0.8);
            ctx.closePath();
            ctx.fill();

            // Speed boost effect
            if (activePowerUps.speed) {
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath();
                ctx.moveTo(player.x + player.width * 0.35, player.y + player.height);
                ctx.lineTo(player.x + player.width * 0.5, player.y + player.height + flameHeight + 10);
                ctx.lineTo(player.x + player.width * 0.65, player.y + player.height);
                ctx.closePath();
                ctx.fill();
            }
        }

        // Draw bullets
        function drawBullets() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffff00';

            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color || '#ffff00';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
        }

        // Draw enemy bullets
        function drawEnemyBullets() {
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff0000';

            enemyBullets.forEach(bullet => {
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
        }

        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = enemy.color;

                // UFO shape
                ctx.beginPath();
                ctx.ellipse(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2,
                           enemy.width / 2, enemy.height / 3, 0, 0, Math.PI * 2);
                ctx.fill();

                // UFO dome
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 3,
                       enemy.width / 4, Math.PI, 0);
                ctx.fill();

                // Health bar for tanks
                if (enemy.maxHealth > 1) {
                    const barWidth = enemy.width;
                    const barHeight = 4;
                    const healthPercent = enemy.health / enemy.maxHealth;

                    ctx.fillStyle = '#333';
                    ctx.fillRect(enemy.x, enemy.y - 8, barWidth, barHeight);
                    ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : healthPercent > 0.25 ? '#ffff00' : '#ff0000';
                    ctx.fillRect(enemy.x, enemy.y - 8, barWidth * healthPercent, barHeight);
                }

                ctx.shadowBlur = 0;
            });
        }

        // Draw boss
        function drawBoss() {
            if (!boss) return;

            ctx.fillStyle = boss.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = boss.color;

            // Main body
            ctx.beginPath();
            ctx.ellipse(boss.x + boss.width / 2, boss.y + boss.height / 2,
                       boss.width / 2, boss.height / 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wings
            ctx.beginPath();
            ctx.moveTo(boss.x, boss.y + boss.height / 2);
            ctx.lineTo(boss.x - 30, boss.y + boss.height);
            ctx.lineTo(boss.x + boss.width / 4, boss.y + boss.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(boss.x + boss.width, boss.y + boss.height / 2);
            ctx.lineTo(boss.x + boss.width + 30, boss.y + boss.height);
            ctx.lineTo(boss.x + boss.width * 0.75, boss.y + boss.height / 2);
            ctx.closePath();
            ctx.fill();

            // Core
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(boss.x + boss.width / 2, boss.y + boss.height / 2, 15, 0, Math.PI * 2);
            ctx.fill();

            // Health bar
            const barWidth = boss.width + 40;
            const barHeight = 10;
            const healthPercent = boss.health / boss.maxHealth;

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#333';
            ctx.fillRect(boss.x - 20, boss.y - 20, barWidth, barHeight);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(boss.x - 20, boss.y - 20, barWidth * healthPercent, barHeight);

            // Boss name
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`BOSS - 波次 ${gameState.wave}`, boss.x + boss.width / 2, boss.y - 25);
        }

        // Draw power-ups
        function drawPowerUps() {
            powerUps.forEach(powerUp => {
                ctx.fillStyle = powerUp.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = powerUp.color;

                // Outer circle
                ctx.beginPath();
                ctx.arc(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2,
                       powerUp.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Inner symbol
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(powerUp.symbol, powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2);

                ctx.shadowBlur = 0;
            });
        }

        // Draw explosions
        function drawExplosions() {
            explosions.forEach((exp, index) => {
                const alpha = 1 - exp.frame / exp.maxFrames;

                // Multiple rings
                for (let i = 0; i < 3; i++) {
                    const radius = exp.radius + exp.frame * (3 - i) * 2;
                    ctx.fillStyle = `rgba(255, ${100 + exp.frame * 8}, 0, ${alpha * (1 - i * 0.3)})`;
                    ctx.beginPath();
                    ctx.arc(exp.x, exp.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                exp.frame++;
                if (exp.frame >= exp.maxFrames) {
                    explosions.splice(index, 1);
                }
            });
        }

        // Draw particles
        function drawParticles() {
            particles.forEach((particle, index) => {
                ctx.fillStyle = `rgba(${particle.r}, ${particle.g}, ${particle.b}, ${particle.alpha})`;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();

                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.alpha -= 0.02;
                particle.size *= 0.98;

                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // Create explosion effect
        function createExplosion(x, y, size = 'normal') {
            const baseRadius = size === 'boss' ? 30 : size === 'large' ? 20 : 10;
            explosions.push({
                x: x,
                y: y,
                radius: baseRadius,
                frame: 0,
                maxFrames: size === 'boss' ? 30 : 20
            });

            // Create particles
            const particleCount = size === 'boss' ? 40 : size === 'large' ? 20 : 10;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    r: 255,
                    g: Math.floor(Math.random() * 150 + 100),
                    b: 0
                });
            }
        }

        // Shoot bullet
        function shootBullet() {
            const now = Date.now();
            if (now - lastBulletTime > bulletCooldown) {
                if (activePowerUps.tripleShot) {
                    // Triple shot
                    bullets.push(
                        { x: player.x + player.width / 2, y: player.y, color: '#ffff00' },
                        { x: player.x + player.width / 2 - 15, y: player.y + 10, color: '#ffff00' },
                        { x: player.x + player.width / 2 + 15, y: player.y + 10, color: '#ffff00' }
                    );
                } else {
                    bullets.push({
                        x: player.x + player.width / 2,
                        y: player.y,
                        color: '#ffff00'
                    });
                }
                lastBulletTime = now;
            }
        }

        // Spawn enemy
        function spawnEnemy() {
            if (gameState.bossActive) return;

            const now = Date.now();
            const adjustedSpawnRate = Math.max(500, enemySpawnRate - gameState.wave * 100);

            if (now - lastEnemySpawn > adjustedSpawnRate) {
                // Choose enemy type based on wave
                let typeKeys = ['BASIC'];
                if (gameState.wave >= 2) typeKeys.push('FAST');
                if (gameState.wave >= 3) typeKeys.push('SHOOTER');
                if (gameState.wave >= 4) typeKeys.push('TANK');

                const typeKey = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                const type = ENEMY_TYPES[typeKey];

                enemies.push({
                    x: Math.random() * (canvas.width - type.width),
                    y: -type.height,
                    ...type,
                    health: type.health,
                    maxHealth: type.health
                });
                lastEnemySpawn = now;
            }
        }

        // Spawn boss
        function spawnBoss() {
            gameState.bossActive = true;
            const bossHealth = 20 + gameState.wave * 10;
            boss = {
                x: canvas.width / 2 - 60,
                y: -100,
                width: 120,
                height: 80,
                health: bossHealth,
                maxHealth: bossHealth,
                color: '#ff00aa',
                speed: 2,
                direction: 1,
                shootTimer: 0,
                targetY: 60
            };
        }

        // Update boss
        function updateBoss() {
            if (!boss) return;

            // Move to target position
            if (boss.y < boss.targetY) {
                boss.y += 1;
            } else {
                // Horizontal movement
                boss.x += boss.speed * boss.direction;
                if (boss.x <= 0 || boss.x >= canvas.width - boss.width) {
                    boss.direction *= -1;
                }

                // Shooting
                boss.shootTimer++;
                if (boss.shootTimer >= 40) {
                    boss.shootTimer = 0;
                    // Triple shot
                    enemyBullets.push(
                        { x: boss.x + boss.width / 2, y: boss.y + boss.height, speed: 5 },
                        { x: boss.x + boss.width / 4, y: boss.y + boss.height, speed: 4 },
                        { x: boss.x + boss.width * 0.75, y: boss.y + boss.height, speed: 4 }
                    );
                }
            }
        }

        // Update game state
        function update() {
            if (gameState.isGameOver || gameState.isPaused) return;

            // Move player
            if (keys.left && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Shoot
            if (keys.space) {
                shootBullet();
            }

            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.y -= bulletSpeed;
                return bullet.y > -10;
            });

            // Update enemy bullets
            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += bullet.speed || 4;
                return bullet.y < canvas.height + 10;
            });

            // Update power-ups
            powerUps = powerUps.filter(powerUp => {
                powerUp.y += powerUp.speed;

                // Check collision with player
                if (powerUp.x < player.x + player.width &&
                    powerUp.x + powerUp.width > player.x &&
                    powerUp.y < player.y + player.height &&
                    powerUp.y + powerUp.height > player.y) {
                    activatePowerUp(powerUp.type);
                    return false;
                }

                return powerUp.y < canvas.height + 30;
            });

            // Check for boss spawn (every 200 points, if no boss active)
            if (gameState.score > 0 && gameState.score % 200 === 0 && !gameState.bossActive && gameState.bossDefeated < Math.floor(gameState.score / 200)) {
                spawnBoss();
            }

            // Update boss
            updateBoss();

            // Spawn enemies
            spawnEnemy();

            // Update enemies
            const waveSpeedBonus = 1 + gameState.wave * 0.15;
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed * waveSpeedBonus;

                // Enemy shooting
                if (enemy.shootChance > 0 && Math.random() < enemy.shootChance) {
                    enemyBullets.push({
                        x: enemy.x + enemy.width / 2,
                        y: enemy.y + enemy.height,
                        speed: 4
                    });
                }

                // Enemy reached bottom
                if (enemy.y > canvas.height) {
                    takeDamage();
                    return false;
                }
                return true;
            });

            // Bullet-enemy collision
            bullets.forEach((bullet, bIndex) => {
                // Check boss
                if (boss &&
                    bullet.x > boss.x && bullet.x < boss.x + boss.width &&
                    bullet.y > boss.y && bullet.y < boss.y + boss.height) {
                    bullets.splice(bIndex, 1);
                    boss.health--;
                    createExplosion(bullet.x, bullet.y, 'small');

                    if (boss.health <= 0) {
                        createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, 'boss');
                        gameState.score += 100 + gameState.wave * 50;
                        scoreElement.textContent = gameState.score;
                        gameState.bossActive = false;
                        gameState.bossDefeated++;
                        gameState.wave++;
                        waveElement.textContent = gameState.wave;
                        boss = null;

                        // Guaranteed power-up drop from boss
                        spawnPowerUp(canvas.width / 2, 100);
                        spawnPowerUp(canvas.width / 2 - 40, 100);
                        spawnPowerUp(canvas.width / 2 + 40, 100);
                    }
                    return;
                }

                // Check enemies
                enemies.forEach((enemy, eIndex) => {
                    if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {
                        bullets.splice(bIndex, 1);
                        enemy.health--;

                        if (enemy.health <= 0) {
                            createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.maxHealth > 1 ? 'large' : 'normal');
                            enemies.splice(eIndex, 1);
                            gameState.score += enemy.score;
                            scoreElement.textContent = gameState.score;
                            spawnPowerUp(enemy.x + enemy.width / 2, enemy.y);
                        } else {
                            // Hit effect
                            createExplosion(bullet.x, bullet.y, 'small');
                        }
                    }
                });
            });

            // Enemy bullet-player collision
            enemyBullets.forEach((bullet, index) => {
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;
                const dx = bullet.x - playerCenterX;
                const dy = bullet.y - playerCenterY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (activePowerUps.shield) {
                    if (distance < player.shieldRadius) {
                        enemyBullets.splice(index, 1);
                        createExplosion(bullet.x, bullet.y, 'small');
                    }
                } else {
                    if (bullet.x > player.x && bullet.x < player.x + player.width &&
                        bullet.y > player.y && bullet.y < player.y + player.height) {
                        enemyBullets.splice(index, 1);
                        takeDamage();
                    }
                }
            });

            // Enemy-player collision
            enemies.forEach((enemy, index) => {
                const collision = enemy.x < player.x + player.width &&
                    enemy.x + enemy.width > player.x &&
                    enemy.y < player.y + player.height &&
                    enemy.y + enemy.height > player.y;

                if (activePowerUps.shield) {
                    const playerCenterX = player.x + player.width / 2;
                    const playerCenterY = player.y + player.height / 2;
                    const enemyCenterX = enemy.x + enemy.width / 2;
                    const enemyCenterY = enemy.y + enemy.height / 2;
                    const dx = enemyCenterX - playerCenterX;
                    const dy = enemyCenterY - playerCenterY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < player.shieldRadius + enemy.width / 2) {
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        enemies.splice(index, 1);
                        gameState.score += enemy.score;
                        scoreElement.textContent = gameState.score;
                    }
                } else if (collision) {
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                    enemies.splice(index, 1);
                    takeDamage();
                }
            });

            // Update high score
            if (gameState.score > highScore) {
                highScore = gameState.score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('spaceShooterHighScore', highScore.toString());
            }
        }

        // Take damage
        function takeDamage() {
            gameState.lives--;
            livesElement.textContent = gameState.lives;
            if (gameState.lives <= 0) {
                gameOver();
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            drawStars();

            // Draw game elements
            drawPowerUps();
            drawPlayer();
            drawBullets();
            drawEnemyBullets();
            drawEnemies();
            drawBoss();
            drawExplosions();
            drawParticles();

            // Pause screen
            if (gameState.isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂停', canvas.width / 2, canvas.height / 2);

                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('按 P 键继续', canvas.width / 2, canvas.height / 2 + 40);
            }

            // Game over screen
            if (gameState.isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 50);

                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText(`最终得分: ${gameState.score}`, canvas.width / 2, canvas.height / 2);
                ctx.fillText(`最高得分: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);
                ctx.fillText(`到达波次: ${gameState.wave}`, canvas.width / 2, canvas.height / 2 + 70);

                ctx.fillStyle = '#00ff88';
                ctx.font = '18px Arial';
                ctx.fillText('按 R 键重新开始', canvas.width / 2, canvas.height / 2 + 110);
            }
        }

        // Stars background
        let stars = [];
        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 1 + 0.2,
                    twinkle: Math.random()
                });
            }
        }

        function drawStars() {
            stars.forEach(star => {
                const twinkle = Math.sin(Date.now() * 0.003 + star.twinkle * 100) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                // Star movement
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        // Game over
        function gameOver() {
            gameState.isGameOver = true;
        }

        // Reset game
        function resetGame() {
            gameState = {
                score: 0,
                lives: 3,
                wave: 1,
                isGameOver: false,
                isPaused: false,
                bossActive: false,
                bossDefeated: 0
            };
            player.x = canvas.width / 2 - 25;
            player.speed = player.baseSpeed;
            bullets = [];
            enemies = [];
            enemyBullets = [];
            explosions = [];
            powerUps = [];
            particles = [];
            boss = null;
            activePowerUps = { tripleShot: false, shield: false, speed: false };
            Object.values(powerUpTimers).forEach(timer => clearTimeout(timer));
            powerUpTimers = {};
            updatePowerUpsDisplay();
            scoreElement.textContent = '0';
            livesElement.textContent = '3';
            waveElement.textContent = '1';
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize and start
        initStars();
        gameLoop();
    </script>
</body>
</html>
